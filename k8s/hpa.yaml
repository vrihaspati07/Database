apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: hind-db-backend-hpa
  namespace: hind-db
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: hind-db-backend
  minReplicas: 3
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: hind-db-frontend-hpa
  namespace: hind-db
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: hind-db-frontend
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75

