apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hind-db-ingress
  namespace: hind-db
  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS": 443}]'
    alb.ingress.kubernetes.io/ssl-redirect: '443'
    alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:ap-south-1:123456789012:certificate/hind-db-ssl-2026
    alb.ingress.kubernetes.io/healthcheck-path: /healthz
    alb.ingress.kubernetes.io/healthcheck-interval-seconds: '15'
    alb.ingress.kubernetes.io/load-balancer-name: hind-db-mumbai-alb
spec:
  rules:
    - host: hind.io
      http:
        paths:
          # Backend API Routing
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: hind-db-backend-svc
                port:
                  number: 3000
          # Frontend SPA Routing
          - path: /
            pathType: Prefix
            backend:
              service:
                name: hind-db-frontend-svc
                port:
                  number: 80
