# Hind DB - ELK Stack Logstash Pipeline
# Product: Hind DB
# Parent Company: Hind India Private Limited

input {
  tcp {
    port => 5000
    codec => json_lines
  }
  beats {
    port => 5044
  }
}

filter {
  mutate {
    add_field => {
      "platform" => "Hind DB Sovereign Platform"
      "company" => "Hind India Private Limited"
      "region" => "ap-south-1"
    }
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "hind-db-logs-%{+YYYY.MM.dd}"
  }
  stdout { codec => rubydebug }
}
